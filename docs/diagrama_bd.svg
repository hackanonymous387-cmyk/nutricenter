<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <style>
    .bg { fill: #0f172a; }
    .table-box { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 8; }
    .table-header { fill: #10b981; }
    .table-title { fill: #ffffff; font-family: sans-serif; font-weight: bold; font-size: 14px; text-anchor: middle; }
    .field-name { fill: #cbd5e1; font-family: sans-serif; font-size: 12px; }
    .field-type { fill: #64748b; font-family: sans-serif; font-size: 11px; }
    .line { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4; }
  </style>

  <rect class="bg" width="100%" height="100%"/>
  <text x="450" y="35" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="20" text-anchor="middle">NUTRICENTER - Diagrama Entidad Relación (ER)</text>

  <!-- ROLES -->
  <g transform="translate(50, 80)">
    <rect class="table-box" width="200" height="120"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">ROLES</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">nombre</text><text x="185" y="80" class="field-type" text-anchor="end">VARCHAR(50)</text>
    <text x="15" y="105" class="field-name">descripcion</text><text x="185" y="105" class="field-type" text-anchor="end">VARCHAR(255)</text>
  </g>

  <!-- USUARIOS -->
  <g transform="translate(350, 80)">
    <rect class="table-box" width="200" height="170"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">USUARIOS</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">nombre</text><text x="185" y="80" class="field-type" text-anchor="end">VARCHAR(100)</text>
    <text x="15" y="105" class="field-name">email</text><text x="185" y="105" class="field-type" text-anchor="end">VARCHAR(100)</text>
    <text x="15" y="130" class="field-name">password</text><text x="185" y="130" class="field-type" text-anchor="end">VARCHAR(255)</text>
    <text x="15" y="155" class="field-name">🔗 rol_id (FK)</text><text x="185" y="155" class="field-type" text-anchor="end">INT</text>
  </g>

  <!-- CATEGORIAS -->
  <g transform="translate(50, 350)">
    <rect class="table-box" width="200" height="120"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">CATEGORIAS</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">nombre</text><text x="185" y="80" class="field-type" text-anchor="end">VARCHAR(100)</text>
    <text x="15" y="105" class="field-name">descripcion</text><text x="185" y="105" class="field-type" text-anchor="end">TEXT</text>
  </g>

  <!-- PRODUCTOS -->
  <g transform="translate(350, 330)">
    <rect class="table-box" width="200" height="170"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">PRODUCTOS</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">sku</text><text x="185" y="80" class="field-type" text-anchor="end">VARCHAR(50)</text>
    <text x="15" y="105" class="field-name">nombre</text><text x="185" y="105" class="field-type" text-anchor="end">VARCHAR(150)</text>
    <text x="15" y="130" class="field-name">precio</text><text x="185" y="130" class="field-type" text-anchor="end">DECIMAL</text>
    <text x="15" y="155" class="field-name">🔗 categoria_id (FK)</text><text x="185" y="155" class="field-type" text-anchor="end">INT</text>
  </g>

  <!-- VENTAS -->
  <g transform="translate(650, 80)">
    <rect class="table-box" width="200" height="170"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">VENTAS</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">codigo_venta</text><text x="185" y="80" class="field-type" text-anchor="end">VARCHAR(50)</text>
    <text x="15" y="105" class="field-name">cliente_nombre</text><text x="185" y="105" class="field-type" text-anchor="end">VARCHAR(150)</text>
    <text x="15" y="130" class="field-name">total</text><text x="185" y="130" class="field-type" text-anchor="end">DECIMAL</text>
    <text x="15" y="155" class="field-name">🔗 usuario_id (FK)</text><text x="185" y="155" class="field-type" text-anchor="end">INT</text>
  </g>

  <!-- DETALLE_VENTAS -->
  <g transform="translate(650, 330)">
    <rect class="table-box" width="200" height="170"/>
    <rect class="table-header" width="200" height="30" rx="6"/>
    <text x="100" y="20" class="table-title">DETALLE_VENTAS</text>
    <text x="15" y="55" class="field-name">🔑 id (PK)</text><text x="185" y="55" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="80" class="field-name">🔗 venta_id (FK)</text><text x="185" y="80" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="105" class="field-name">🔗 producto_id (FK)</text><text x="185" y="105" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="130" class="field-name">cantidad</text><text x="185" y="130" class="field-type" text-anchor="end">INT</text>
    <text x="15" y="155" class="field-name">subtotal</text><text x="185" y="155" class="field-type" text-anchor="end">DECIMAL</text>
  </g>

  <!-- CONNECTIONS -->
  <line x1="250" y1="140" x2="350" y2="140" class="line"/>
  <line x1="250" y1="410" x2="350" y2="410" class="line"/>
  <line x1="550" y1="140" x2="650" y2="140" class="line"/>
  <line x1="750" y1="250" x2="750" y2="330" class="line"/>
  <line x1="550" y1="410" x2="650" y2="410" class="line"/>
</svg>
