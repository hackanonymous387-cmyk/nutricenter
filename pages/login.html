<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión Clientes - Nutricenter Perú</title>
  
  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Global & Auth Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/auth.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">

  <script src="../assets/js/nutri-db.js"></script>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/auth.js" defer></script>
  <script src="../assets/js/validation.js" defer></script>
</head>
<body>

  <div class="auth-wrapper">
    <!-- Back to Store Link -->
    <a href="../index.html" class="auth-back-link">
      <i class="bi bi-arrow-left"></i> Volver a la Tienda
    </a>

    <!-- Main Auth Card -->
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo-link">
          <img src="../assets/images/Recurso-6.png" alt="Nutricenter Logo" class="auth-logo-img">
        </a>
        <div style="margin-top: 0.75rem;">
          <span class="auth-badge" style="background: #fee2e2; color: #e60000; border: 1px solid #fecaca; font-weight: 800;">
            <i class="bi bi-person-fill"></i> Acceso Clientes
          </span>
        </div>
        <p style="font-size: 0.85rem; color: #64748b; margin: 0.6rem 0 0; text-align: center; line-height: 1.4;">
          Inicia sesión para realizar tus compras, autocompletar tu envío y ver el seguimiento de tus pedidos.
        </p>
      </div>

      <!-- Notice for Checkout / Purchase Redirect -->
      <div id="checkoutRedirectNotice" style="display:none; margin-bottom: 1.25rem; background: #fff5f5; border: 1.5px solid #fecaca; border-radius: 12px; padding: 0.75rem 1rem; font-size: 0.85rem; color: #e60000; font-weight: 700; text-align: center;">
        <i class="bi bi-bag-check-fill" style="margin-right: 0.35rem;"></i> Inicia sesión con tu cuenta de cliente para completar tu compra
      </div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)" novalidate>
        <!-- Email Field -->
        <div class="auth-form-group">
          <label class="auth-label" for="loginEmail">
            <i class="bi bi-envelope-fill"></i> Correo Electrónico
          </label>
          <div class="auth-input-wrap">
            <i class="bi bi-envelope auth-input-icon"></i>
            <input 
              type="email" 
              id="loginEmail" 
              class="auth-input" 
              placeholder="cliente@gmail.com" 
              value="cliente@gmail.com"
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="auth-form-group">
          <label class="auth-label" for="loginPassword">
            <i class="bi bi-shield-lock-fill"></i> Contraseña
          </label>
          <div class="auth-input-wrap">
            <i class="bi bi-key-fill auth-input-icon"></i>
            <input 
              type="password" 
              id="loginPassword" 
              class="auth-input" 
              placeholder="••••••••" 
              value="123456"
              required 
              autocomplete="current-password"
            >
            <button type="button" class="auth-toggle-pass-btn" onclick="togglePasswordVisibility()" title="Mostrar/ocultar contraseña" aria-label="Mostrar contraseña">
              <i class="bi bi-eye" id="togglePassIcon"></i>
            </button>
          </div>
        </div>

        <!-- Options Row -->
        <div class="auth-options-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span>Recordarme</span>
          </label>
          <a href="registro.html" class="auth-register-link">
            ¿No tienes cuenta? Regístrate
          </a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-submit-btn" id="loginBtn">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
        </button>
      </form>

      <!-- Customer Test Account Callout -->
      <div class="auth-demo-card">
        <div class="auth-demo-header">
          <i class="bi bi-person-check-fill" style="color: #e60000;"></i>
          <span>Acceso Rápido de Cliente (Prueba):</span>
        </div>
        <div style="margin-top: 0.5rem;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="autofillDemo('cliente')" style="width: 100%; justify-content: space-between; font-size: 0.8rem; padding: 0.5rem 0.85rem; border: 1.5px solid #e60000; background: #fff5f5; color: #0f172a; border-radius: 8px;">
            <span><strong style="color: #e60000;"><i class="bi bi-person-fill"></i> Cliente:</strong> cliente@gmail.com</span>
            <span class="badge" style="background: #e60000; color: #ffffff;">Cargar</span>
          </button>
        </div>

        <!-- Secret Administrator Panel (Hidden from customers, only visible with ?admin=1 or Ctrl+Shift+A) -->
        <div id="adminSecretPanel" style="display: none; margin-top: 1rem; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 0.65rem; text-align: left;">
          <div style="font-size: 0.72rem; color: #64748b; font-weight: 700; margin-bottom: 0.35rem;">
            <i class="bi bi-shield-lock-fill"></i> Personal Autorizado Nutricenter:
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.35rem;">
            <button type="button" class="btn btn-secondary btn-sm" onclick="autofillDemo('admin')" style="justify-content: space-between; font-size: 0.75rem; padding: 0.35rem 0.6rem;">
              <span><strong style="color: #ef4444;">Admin:</strong> admin@nutricenter.com</span>
              <span class="badge badge-danger">Dashboard</span>
            </button>
            <button type="button" class="btn btn-secondary btn-sm" onclick="autofillDemo('vendedor')" style="justify-content: space-between; font-size: 0.75rem; padding: 0.35rem 0.6rem;">
              <span><strong style="color: #f59e0b;">Vendedor:</strong> vendedor@nutricenter.com</span>
              <span class="badge badge-warning">POS Ventas</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const redirect = urlParams.get('redirect');
      if (redirect) {
        sessionStorage.setItem('nutri_auth_redirect', redirect);
        const notice = document.getElementById('checkoutRedirectNotice');
        if (notice) notice.style.display = 'block';
        const regLink = document.querySelector('.auth-register-link');
        if (regLink) regLink.href = `registro.html?redirect=${encodeURIComponent(redirect)}`;
        autofillDemo('cliente');
      }

      // Keep administrator strictly hidden unless explicitly requested with ?admin=1 in the URL
      if (urlParams.get('admin') === '1' || urlParams.get('admin') === 'true') {
        const secretPanel = document.getElementById('adminSecretPanel');
        if (secretPanel) secretPanel.style.display = 'block';
      }

      // Secret keyboard shortcut (Ctrl+Shift+A) for authorized staff only
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
          e.preventDefault();
          const secretPanel = document.getElementById('adminSecretPanel');
          if (secretPanel) {
            secretPanel.style.display = secretPanel.style.display === 'none' ? 'block' : 'none';
          }
        }
      });
    });

    function togglePasswordVisibility() {
      const passInput = document.getElementById('loginPassword');
      const icon = document.getElementById('togglePassIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        passInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }

    function autofillDemo(role = 'cliente') {
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPassword');
      if (role === 'vendedor') {
        emailInput.value = 'vendedor@nutricenter.com';
        passInput.value = '123456';
      } else if (role === 'admin') {
        emailInput.value = 'admin@nutricenter.com';
        passInput.value = '123456';
      } else {
        emailInput.value = 'cliente@gmail.com';
        passInput.value = '123456';
      }
      if (typeof showToast === 'function') {
        showToast(`Credenciales cargadas`, 'info');
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      const vEmail = Validation.validateField(
        document.getElementById('loginEmail'),
        Validation.isValidEmail(email),
        'Ingrese un correo válido'
      );

      const vPass = Validation.validateField(
        document.getElementById('loginPassword'),
        Validation.isValidPassword(pass),
        'La contraseña debe tener mínimo 6 caracteres'
      );

      if (vEmail && vPass) {
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-arrow-repeat fa-spin"></i> Verificando...';

        Auth.login(email, pass).finally(() => {
          setTimeout(() => {
            if (btn) {
              btn.disabled = false;
              btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión';
            }
          }, 1200);
        });
      }
    }
  </script>
</body>
</html>
