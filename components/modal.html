<!-- NUTRICENTER Dynamic Modal Component Template -->
<div id="app-modal" class="modal-backdrop" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 999; align-items: center; justify-content: center;">
  <div class="modal-dialog card" style="width: 500px; max-width: 90%; background: #ffffff; padding: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);">
    
    <div class="modal-header" style="padding: 1.25rem 1.5rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
      <h3 id="modal-title" style="margin: 0; font-size: 1.125rem; color: #0f172a;">Título del Modal</h3>
      <button onclick="closeModal('app-modal')" style="background: none; border: none; font-size: 1.5rem; color: #64748b; cursor: pointer;">&times;</button>
    </div>

    <div id="modal-body" class="modal-body" style="padding: 1.5rem;">
      <!-- Dynamic Content Injected Here -->
    </div>

    <div id="modal-footer" class="modal-footer" style="padding: 1rem 1.5rem; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 0.75rem;">
      <button onclick="closeModal('app-modal')" class="btn btn-secondary btn-sm">Cancelar</button>
      <button id="modal-confirm-btn" class="btn btn-primary btn-sm">Confirmar</button>
    </div>

  </div>
</div>
