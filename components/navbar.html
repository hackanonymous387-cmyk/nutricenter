<!-- NUTRICENTER Navbar Component -->
<nav class="app-header">
  <div style="display: flex; align-items: center; gap: 1rem;">
    <a href="../index.html">
      <img src="../assets/images/Recurso-6.png" alt="Nutricenter Logo" style="max-height: 42px;">
    </a>
  </div>

  <div style="display: flex; align-items: center; gap: 1.25rem;">
    <a href="../index.html" class="nav-link"><i class="bi bi-house-door me-1"></i> Inicio</a>
    <a href="productos.html" class="nav-link"><i class="bi bi-grid me-1"></i> Catálogo</a>
    
    <div id="auth-nav-container" style="display: flex; gap: 0.75rem;">
      <a href="login.html" class="btn btn-outline btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión</a>
      <a href="registro.html" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i> Registrarse</a>
    </div>
  </div>
</nav>

<script>
  // Dynamic header state script
  (function() {
    const user = JSON.parse(localStorage.getItem('nutri_user') || 'null');
    const container = document.getElementById('auth-nav-container');
    if (user && container) {
      container.innerHTML = `
        <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="bi bi-speedometer2 me-1"></i> Panel</a>
        <span style="font-size: 0.875rem; font-weight: 600; color: #ffffff; display: flex; align-items: center;"><i class="bi bi-person-circle me-1 text-danger"></i> ${user.nombre || 'Usuario'}</span>
        <button onclick="Auth.logout()" class="btn btn-outline btn-sm" style="border-color: #ef4444; color: #ef4444;"><i class="bi bi-box-arrow-right me-1"></i> Salir</button>
      `;
    }
  })();
</script>
